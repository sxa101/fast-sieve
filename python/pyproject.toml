[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastsieve"
version = "1.0.0"
description = "Python bindings for the fastsieve prime-counting engine"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "sxa101"}]

[tool.setuptools]
packages = ["fastsieve"]
